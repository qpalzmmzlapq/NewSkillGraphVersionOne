}

async function callDeepSeek(text,key,model){
  const SYS=`Ты — аналитическая система SkillGraph. Разбери задачу заказчика и верни строго валидный JSON без markdown.
Схема:{"summary":"...","modules":[{"name":"...","description":"...","ai_level":"hi|mid|lo","ai_label":"..."}],"skills":[{"name":"...","required":true|false}],"risks":[{"level":"Высокий|Средний|Низкий","text":"..."}],"ai_use":[{"level":"Высокая|Средняя|Низкая","text":"..."}]}
modules 4-7, skills 6-12, risks 2-4, ai_use 2-4. Русский. Только JSON.`;
  const body={model,messages:[{role:'system',content:SYS},{role:'user',content:`Задача: "${text}"`}],temperature:.4,max_tokens:2000};
  if(model==='deepseek-chat') body.response_format={type:'json_object'};

  const res=await fetch('https://api.deepseek.com/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
    body:JSON.stringify(body),
  });
  if(!res.ok){
    let d=''; try{ const j=await res.json(); d=j.error?.message||JSON.stringify(j); }catch{ d=await res.text().catch(()=>''); }
    throw new Error(`API ${res.status}: ${d}`);
  }
  const data=await res.json();
  let raw=(data.choices?.[0]?.message?.content||'').trim();
  const f=raw.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) raw=f[1].trim();
  const i=raw.indexOf('{'), j=raw.lastIndexOf('}');
  if(i>-1&&j>i) raw=raw.slice(i,j+1);
  return JSON.parse(raw);
}

function renderAnalysisHTML(data){
  const mods=(data.modules||[]).map(m=>{
    const lvl=['hi','mid','lo'].includes(m.ai_level)?m.ai_level:'mid';
    const lbl=m.ai_label||({hi:'ИИ применим высоко',mid:'ИИ применим средне',lo:'Требует человека'})[lvl];
    const cls=lvl==='hi'?'green':lvl==='mid'?'yellow':'red';
    return `<div class="a-mod"><h4>${esc(m.name)}</h4><p>${esc(m.description)}</p><span class="tag ${cls}">${esc(lbl)}</span></div>`;
  }).join('');

  const skills=(data.skills||[]).map(s=>`<span class="chip ${s.required?'red':''}">${esc(s.name)}</span>`).join('');

  const risks=(data.risks||[]).map(r=>{
    const cls=String(r.level).startsWith('Выс')?'high':String(r.level).startsWith('Сред')?'mid':'low';
    return `<div class="a-risk"><span class="rk ${cls}">${esc(r.level)}</span><span>${esc(r.text)}</span></div>`;
  }).join('');

  const aiUse=(data.ai_use||[]).map(a=>{
    const cls=String(a.level).startsWith('Выс')?'low':String(a.level).startsWith('Сред')?'mid':'high';
    return `<div class="a-risk"><span class="rk ${cls}">${esc(a.level)}</span><span>${esc(a.text)}</span></div>`;
  }).join('');

  return `
    <div class="a-summary"><b>Резюме.</b> ${esc(data.summary||'')}</div>
    <div class="a-sec">Модули</div>
    <div class="a-mods">${mods}</div>
    <div class="a-sec">Компетенции</div>
    <div class="a-chips">${skills}</div>
    <div class="a-sec">Риски</div>
    <div class="a-risks">${risks}</div>
    <div class="a-sec">Возможность использования ИИ</div>
    <div class="a-risks">${aiUse}</div>
  `;
}

function updateAppStatus(appId,status,taskId){
  const apps=db.apps();
  const i=apps.findIndex(a=>a.id===appId); if(i<0) return;
  apps[i].status=status;
  db.saveApps(apps);

  if(status==='accepted'){
    apps.forEach((a,idx)=>{ if(a.task_id===taskId&&a.id!==appId&&a.status==='pending') apps[idx].status='rejected'; });
    db.saveApps(apps);
    const ts=db.tasks(); const ti=ts.findIndex(t=>t.id===taskId);
    if(ti>=0){ ts[ti].status='in_progress'; ts[ti].updated_at=Date.now(); db.saveTasks(ts); }
  }
  toast('Готово','ok');
  closeModal();
  renderApp('tasks');
}

      <div style="display:flex;gap:18px;align-items:center;margin-bottom:24px;padding-bottom:22px;border-bottom:1px dashed var(--rule-2)">
        ${avatarHTML(u,'xl')}
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:700;font-family:var(--f-display);letter-spacing:-.015em;margin-bottom:5px">${esc(u.title||roleLabel(u.role))}</div>
          <div class="mono" style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)">${u.years?u.years+' ЛЕТ':''}${u.location?' · '+esc(u.location):''}</div>
          ${u.bio?`<p style="font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:14px">${esc(u.bio)}</p>`:''}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px">
        <div>
          <div class="label">Подтверждено</div>
          <div class="num-display" style="font-size:32px;margin-top:6px">${verified}</div>
        </div>
        <div>
          <div class="label">Всего навыков</div>
          <div class="num-display" style="font-size:32px;margin-top:6px">${gd.nodes.length}</div>
        </div>
      </div>

      <div class="a-sec">Карта навыков</div>
      <div class="graph-wrap" id="candGraph" style="min-height:380px"></div>
    </div>
    <div class="modal-foot">
      ${canMsg?`<button class="btn btn-red" id="btnMsgCand">${ic('mail',14)} Написать</button>`:''}
      <button class="btn" data-close>Закрыть</button>
    </div>
  `,{size:'wide',onMount:()=>{
    if(gd.nodes.length) renderSkillGraph($('#candGraph'),gd,{height:380,compact:true});
    else $('#candGraph').innerHTML=`<div style="padding:40px;text-align:center;color:var(--ink-3);font-size:13px">Навыков пока нет</div>`;
    $('#btnMsgCand')?.addEventListener('click',()=>{
      const conv=findOrCreateConv(me.id,userId);
      closeModal();
      go('app/chat/'+conv.id);
    });
  }});
}

/* ============================================================================
   30. CONVERSATIONS
   ============================================================================ */
function findOrCreateConv(a,b,taskId=null){
  const convs=db.convs();
  const [x,y]=a<b?[a,b]:[b,a];
  const ex=convs.find(c=>c.user_a===x&&c.user_b===y&&(c.task_id||null)===(taskId||null));
  if(ex) return ex;
  const nc={id:uid('cv'),user_a:x,user_b:y,task_id:taskId,created_at:Date.now(),last_at:Date.now()};
  convs.push(nc);
  db.saveConvs(convs);
  return nc;
}

/* ============================================================================
   31. NOTIFICATIONS
   ============================================================================ */
function openNotifications(){
  const me=state.user;
  const myApps=db.apps().filter(a=>a.specialist_id===me.id);
  const myTasks=db.tasks().filter(t=>t.customer_id===me.id);
  const allApps=db.apps().filter(a=>myTasks.some(t=>t.id===a.task_id));
  const items=[];

  myApps.slice(-3).reverse().forEach(a=>{
    const t=db.tasks().find(x=>x.id===a.task_id); if(!t) return;
    items.push({
      kind:a.status==='accepted'?'green':a.status==='rejected'?'red':'yellow',
      text:a.status==='accepted'?`Ваш отклик на «${t.title}» принят`:a.status==='rejected'?`Отклик на «${t.title}» отклонён`:`Отклик на «${t.title}» рассматривается`,
      time:a.created_at,
    });
  });
  allApps.slice(-3).reverse().forEach(a=>{
    const sp=db.users().find(u=>u.id===a.specialist_id);
    const t=db.tasks().find(x=>x.id===a.task_id);
    if(!sp||!t) return;
    items.push({kind:'red',text:`Новый отклик от ${sp.name} на «${t.title}»`,time:a.created_at});
  });
  items.push({kind:'paper',text:`${greeting()}. У вас ${db.userSkills().filter(x=>x.user_id===me.id&&x.level==='verified').length} подтверждённых навыков.`,time:Date.now()-1000*60*60*2});

  const itemsHTML=items.length?items.sort((a,b)=>b.time-a.time).slice(0,12).map(i=>`
    <div class="feed-row">
      <div class="fi ${i.kind}">${ic('check',11,{stroke:2.4})}</div>
      <div class="fb"><p>${esc(i.text)}</p></div>
      <div class="ft">${fmtRel(i.time)}</div>
    </div>
  `).join(''):`<div style="padding:56px 20px;text-align:center;color:var(--ink-3);font-size:13.5px">Пока ничего нового</div>`;

  openModal(`
    <div class="modal-head">
      <h2>Уведомления</h2>
      <button class="close" data-close>${ic('close',18)}</button>
    </div>
    <div class="modal-body flush">
      <div class="feed">${itemsHTML}</div>
    </div>
  `,{size:'narrow'});
}

/* ============================================================================
   32. SEARCH
   ============================================================================ */
function openSearch(){
  const me=state.user;
  openModal(`
    <div style="padding:0">
      <div class="search" style="margin:16px">
        ${ic('search',16)}
        <input id="searchInput" placeholder="Поиск задач, людей, курсов…" autofocus>
        <span class="kbd">ESC</span>
      </div>
      <div id="searchResults" style="max-height:60vh;overflow-y:auto;border-top:1px solid var(--rule)"></div>
    </div>
  `,{size:'narrow',onMount:()=>{
    const inp=$('#searchInput'), res=$('#searchResults');
    const render=q=>{
      q=(q||'').trim().toLowerCase();
      const m=[];
      db.tasks().forEach(t=>{
        if(q&&!(t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q))) return;
        m.push({icon:'list',title:t.title,sub:`Задача · ${fmtMoney(t.budget)}`,onClick:()=>{ closeModal(); openTaskModal(t.id); }});
      });
      db.users().forEach(u=>{
        if(u.id===me.id) return;
        if(q&&!(u.name.toLowerCase().includes(q)||(u.title||'').toLowerCase().includes(q))) return;
        m.push({icon:'users',title:u.name,sub:u.title||roleLabel(u.role),onClick:()=>{ closeModal(); openCandidateProfile(u.id); }});
      });
      db.courses().filter(c=>c.status==='published').forEach(c=>{
        if(q&&!c.title.toLowerCase().includes(q)) return;
        m.push({icon:'book',title:c.title,sub:`Курс · ${c.price?fmtMoney(c.price):'Бесплатно'}`,onClick:()=>{ closeModal(); go('app/courses/view/'+c.id); }});
      });
      const lim=m.slice(0,30);
      res.innerHTML=lim.length?`<div class="feed">${lim.map((x,i)=>`
        <div class="feed-row" data-i="${i}" style="cursor:pointer">
          <div class="fi red">${ic(x.icon,11)}</div>
          <div class="fb">
            <p style="margin-bottom:2px"><b>${esc(x.title)}</b></p>
            <p style="font-size:12px;color:var(--ink-3)">${esc(x.sub)}</p>
          </div>
        </div>
      `).join('')}</div>`:`<div style="padding:56px 20px;text-align:center;color:var(--ink-3);font-size:13.5px">${q?'Ничего не найдено':'Начните вводить запрос'}</div>`;
      $$('.feed-row[data-i]',res).forEach(el=>el.addEventListener('click',()=>lim[+el.dataset.i].onClick()));
    };
    render('');
    inp.addEventListener('input',()=>render(inp.value));
    setTimeout(()=>inp.focus(),50);
  }});
}

/* ============================================================================
   33. INIT
   ============================================================================ */
function init(){
  seedIfEmpty();
  const s=store.get(K.session);
  if(s){
    const fresh=db.users().find(u=>u.id===s.id);
    if(fresh){ const safe={...fresh}; delete safe.password; state.user=safe; }
  }
  window.addEventListener('hashchange',route);
  route();
}

document.addEventListener('DOMContentLoaded',init);

})();
</script>
