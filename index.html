<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillGraph — подтверждённые компетенции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --paper:#f2efe6;
  --paper-2:#ebe7db;
  --paper-3:#e3dfd0;
  --surface:#faf8f2;
  --surface-2:#f5f2e8;
  --ink:#0f0f0d;
  --ink-2:#3d3b36;
  --ink-3:#76736b;
  --ink-4:#a5a19a;
  --ink-5:#c8c4bb;
  --rule:#d9d5c8;
  --rule-2:#c8c3b4;
  --rule-3:#a8a394;
  --red:#d13e26;
  --red-2:#a82e1a;
  --red-3:#e55a3f;
  --red-soft:rgba(209,62,38,.07);
  --green:#1e4d3a;
  --green-soft:rgba(30,77,58,.08);
  --yellow:#c98a0a;
  --yellow-soft:rgba(201,138,10,.1);
  --blue:#2e4d6b;
  --blue-soft:rgba(46,77,107,.08);

  --f-display:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --sb-w:248px;
  --container:1240px;
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--f-body);
  font-size:14.5px;
  line-height:1.55;
  color:var(--ink);
  background:var(--paper);
  overflow-x:hidden;
  min-height:100vh;
}
img,svg{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}

::selection{background:var(--red);color:#fff}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:700;letter-spacing:-.025em;line-height:1.05}
h1{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
h2{font-size:32px;letter-spacing:-.03em;line-height:1.08}
h3{font-size:22px;letter-spacing:-.02em}
h4{font-size:17px;letter-spacing:-.015em;font-weight:600}
h5{font-size:14px;font-weight:600;letter-spacing:-.005em}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.label{
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:500;
  line-height:1;
}
.label.red{color:var(--red)}
.label.strong{color:var(--ink);font-weight:600}

.num-display{
  font-family:var(--f-display);
  font-weight:800;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}

.section-title{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid var(--rule-2);
}
.section-title .num{
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  color:var(--red);
}
.section-title h2{
  font-size:15px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-family:var(--f-mono);
}
.section-title .right{
  margin-left:auto;
  font-family:var(--f-mono);
  font-size:11px;
  color:var(--ink-3);
  letter-spacing:.06em;
}

/* ============================================================
   LAYOUT UTILITIES
   ============================================================ */
.hidden{display:none!important}
.flex{display:flex}
.flex-col{display:flex;flex-direction:column}
.flex-center{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-end{display:flex;align-items:center;justify-content:flex-end}
.flex-wrap{flex-wrap:wrap}
.items-start{align-items:flex-start}
.items-center{align-items:center}
.items-end{align-items:flex-end}
.justify-center{justify-content:center}
.flex-1{flex:1}
.min-w-0{min-width:0}
.gap-2{gap:2px}.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}
.gap-10{gap:10px}.gap-12{gap:12px}.gap-14{gap:14px}.gap-16{gap:16px}
.gap-20{gap:20px}.gap-24{gap:24px}.gap-32{gap:32px}.gap-40{gap:40px}
.text-center{text-align:center}
.text-right{text-align:right}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relative{position:relative}
.cursor-pointer{cursor:pointer}
.mt-4{margin-top:4px}.mt-6{margin-top:6px}.mt-8{margin-top:8px}
.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-4{margin-bottom:4px}.mb-6{margin-bottom:6px}.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}

.divider{height:1px;background:var(--rule);margin:24px 0}
.divider-dash{height:1px;background-image:linear-gradient(90deg,var(--rule-2) 50%,transparent 50%);background-size:6px 1px;background-repeat:repeat-x;margin:20px 0}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 18px;
  font-family:var(--f-display);
  font-size:13px;
  font-weight:600;
  letter-spacing:.01em;
  line-height:1;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  transition:background .12s ease,color .12s ease,border-color .12s ease;
  white-space:nowrap;
  user-select:none;
}
.btn:hover{background:#2a2925;border-color:#2a2925}
.btn:active{background:#050504}
.btn:disabled{opacity:.35;cursor:not-allowed}

.btn-outline{
  background:transparent;
  color:var(--ink);
  border-color:var(--ink);
}
.btn-outline:hover{background:var(--ink);color:var(--paper)}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border-color:transparent;
}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--rule-2)}

.btn-red{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}
.btn-red:hover{background:var(--red-2);border-color:var(--red-2)}

.btn-danger{
  background:transparent;
  color:var(--red);
  border-color:var(--red);
}
.btn-danger:hover{background:var(--red);color:#fff}

.btn-sm{padding:7px 12px;font-size:11.5px}
.btn-xs{padding:5px 9px;font-size:10.5px;letter-spacing:.03em}
.btn-lg{padding:14px 24px;font-size:14px}
.btn-xl{padding:18px 32px;font-size:15px}
.btn-full{width:100%}

.btn-icon{
  width:34px;height:34px;padding:0;
  display:inline-grid;place-items:center;
  background:transparent;
  border:1px solid var(--rule-2);
  color:var(--ink);
  transition:.12s;
}
.btn-icon:hover{background:var(--paper-2);border-color:var(--ink)}
.btn-icon.sm{width:28px;height:28px}

/* ============================================================
   INPUTS
   ============================================================ */
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:8px;
}
.field .hint{
  font-size:12px;
  color:var(--ink-3);
  margin-top:6px;
  line-height:1.5;
}

.input,.textarea,.select{
  width:100%;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--rule-2);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.4;
  transition:border-color .12s;
}
.input:hover,.textarea:hover,.select:hover{border-color:var(--rule-3)}
.input:focus,.textarea:focus,.select:focus{
  outline:none;
  border-color:var(--ink);
  background:#fff;
}
.input::placeholder,.textarea::placeholder{color:var(--ink-4)}

.textarea{resize:vertical;min-height:110px;line-height:1.6;font-family:var(--f-body)}

.select{
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%230f0f0d' stroke-width='1.6' stroke-linecap='square'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:38px;
  cursor:pointer;
}

.search{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--rule-2);
  transition:.12s;
}
.search:focus-within{border-color:var(--ink);background:#fff}
.search svg{color:var(--ink-3);flex-shrink:0}
.search input{flex:1;font-size:13px;padding:0;background:none;border:none;outline:none}
.search .kbd{
  font-family:var(--f-mono);
  font-size:10px;
  padding:3px 6px;
  background:var(--paper-2);
  border:1px solid var(--rule);
  color:var(--ink-3);
  letter-spacing:.02em;
}

/* ============================================================
   CHIPS / TAGS
   ============================================================ */
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:var(--paper-2);
  border:1px solid var(--rule-2);
  color:var(--ink-2);
  white-space:nowrap;
  line-height:1.4;
}
.chip.red{background:var(--red-soft);border-color:rgba(209,62,38,.3);color:var(--red)}
.chip.green{background:var(--green-soft);border-color:rgba(30,77,58,.3);color:var(--green)}
.chip.yellow{background:var(--yellow-soft);border-color:rgba(201,138,10,.3);color:var(--yellow)}
.chip.blue{background:var(--blue-soft);border-color:rgba(46,77,107,.3);color:var(--blue)}
.chip.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.red-solid{background:var(--red);color:#fff;border-color:var(--red)}

.tag{
  display:inline-flex;
  align-items:center;
  padding:2px 8px;
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:var(--paper-2);
  border:1px solid var(--rule);
  color:var(--ink-3);
  white-space:nowrap;
  line-height:1.5;
}
.tag.red{background:var(--red-soft);border-color:rgba(209,62,38,.25);color:var(--red)}
.tag.green{background:var(--green-soft);border-color:rgba(30,77,58,.25);color:var(--green)}
.tag.yellow{background:var(--yellow-soft);border-color:rgba(201,138,10,.25);color:var(--yellow)}
.tag.blue{background:var(--blue-soft);border-color:rgba(46,77,107,.25);color:var(--blue)}

/* ============================================================
   AVATARS
   ============================================================ */
.avatar{
  display:inline-grid;
  place-items:center;
  width:36px;height:36px;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--f-display);
  font-weight:700;
  font-size:13px;
  letter-spacing:.01em;
  overflow:hidden;
  flex-shrink:0;
  border-radius:0;
  user-select:none;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.xs{width:24px;height:24px;font-size:9px}
.avatar.sm{width:30px;height:30px;font-size:11px}
.avatar.lg{width:48px;height:48px;font-size:17px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.avatar.xxl{width:88px;height:88px;font-size:30px}
.avatar.red{background:var(--red);color:#fff}
.avatar.green{background:var(--green);color:var(--paper)}
.avatar.blue{background:var(--blue);color:var(--paper)}
.avatar.paper{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule-2)}

.avatar-stack{display:inline-flex}
.avatar-stack .avatar{margin-left:-6px;border:2px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}

/* ============================================================
   LANDING
   ============================================================ */
.landing-nav{
  position:sticky;top:0;z-index:100;
  background:var(--paper);
  border-bottom:1px solid var(--ink);
}
.ln-inner{
  max-width:var(--container);
  margin:0 auto;
  padding:16px 32px;
  display:flex;
  align-items:center;
  gap:32px;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:var(--f-display);
  font-weight:800;
  font-size:19px;
  letter-spacing:-.03em;
  color:var(--ink);
  line-height:1;
}
.brand-mark{
  width:22px;height:22px;
  background:var(--red);
  position:relative;
  flex-shrink:0;
}
.brand-mark::before{
  content:'';
  position:absolute;
  top:3px;left:3px;
  width:6px;height:6px;
  background:var(--paper);
}
.brand-mark::after{
  content:'';
  position:absolute;
  bottom:3px;right:3px;
  width:6px;height:6px;
  background:var(--paper);
}
.brand.sm{font-size:16px}
.brand.sm .brand-mark{width:18px;height:18px}
.brand.sm .brand-mark::before{top:2.5px;left:2.5px;width:5px;height:5px}
.brand.sm .brand-mark::after{bottom:2.5px;right:2.5px;width:5px;height:5px}

.ln-links{display:flex;gap:4px;margin-left:20px}
.ln-links a{
  padding:8px 14px;
  font-family:var(--f-mono);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-2);
  transition:.12s;
}
.ln-links a:hover{color:var(--ink);background:var(--paper-2)}
.ln-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* HERO */
.hero{
  max-width:var(--container);
  margin:0 auto;
  padding:80px 32px 64px;
}
.hero-top{
  display:flex;
  gap:24px;
  align-items:baseline;
  margin-bottom:40px;
  padding-bottom:24px;
  border-bottom:1px solid var(--rule-2);
}
.hero-top .meta{
  flex:1;
  display:flex;
  gap:32px;
  font-family:var(--f-mono);
  font-size:11.5px;
  letter-spacing:.06em;
  color:var(--ink-3);
  text-transform:uppercase;
}
.hero-top .meta b{color:var(--red);font-weight:600}

.hero h1{
  font-size:82px;
  line-height:.95;
  letter-spacing:-.045em;
  font-weight:800;
  max-width:1000px;
  margin-bottom:36px;
}
.hero h1 em{
  font-style:normal;
  color:var(--red);
  position:relative;
  display:inline-block;
}
.hero h1 em::after{
  content:'';
  position:absolute;
  left:0;right:0;bottom:.02em;
  height:.06em;
  background:var(--red);
}

.hero-bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  align-items:start;
  margin-top:32px;
}
.hero-lead{
  font-size:17px;
  line-height:1.6;
  color:var(--ink-2);
  max-width:520px;
}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

.hero-stats{
  border-left:1px solid var(--rule-2);
  padding-left:40px;
}
.hero-stats .row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:14px 0;
  border-bottom:1px solid var(--rule);
}
.hero-stats .row:last-child{border-bottom:none}
.hero-stats .row .k{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.hero-stats .row .v{
  font-family:var(--f-display);
  font-size:26px;
  font-weight:800;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.hero-stats .row .v small{
  font-size:13px;
  font-weight:600;
  color:var(--ink-3);
  letter-spacing:0;
}

/* MARQUEE / TICKER */
.ticker{
  border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:14px 0;
  overflow:hidden;
  white-space:nowrap;
  margin:64px 0;
}
.ticker-inner{
  display:inline-flex;
  gap:48px;
  animation:ticker 40s linear infinite;
  font-family:var(--f-mono);
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.ticker-inner span{display:inline-flex;align-items:center;gap:14px}
.ticker-inner span::after{
  content:'◆';
  color:var(--red);
  font-size:8px;
}
@keyframes ticker{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* SECTIONS */
.landing-section{
  max-width:var(--container);
  margin:0 auto;
  padding:80px 32px;
  border-top:1px solid var(--rule-2);
}
.ls-head{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:48px;
  margin-bottom:56px;
  align-items:start;
}
.ls-head .lhn{
  font-family:var(--f-mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.14em;
  color:var(--red);
  text-transform:uppercase;
  padding-top:8px;
}
.ls-head .lhb h2{
  font-size:44px;
  letter-spacing:-.035em;
  line-height:1.05;
  margin-bottom:18px;
  max-width:800px;
}
.ls-head .lhb p{
  font-size:16px;
  line-height:1.65;
  color:var(--ink-2);
  max-width:640px;
}

/* ROLE GRID */
.roles-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--ink);
  border-left:1px solid var(--ink);
}
.role-card{
  border-right:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  padding:32px 28px 30px;
  display:flex;
  flex-direction:column;
  min-height:420px;
  position:relative;
  cursor:pointer;
  background:var(--paper);
  transition:background .15s;
}
.role-card:hover{background:var(--paper-2)}
.role-card:hover .rc-cta{color:var(--red)}
.role-card .rc-num{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.14em;
  color:var(--red);
  margin-bottom:auto;
}
.role-card h3{
  font-size:38px;
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.02;
  margin:24px 0 16px;
  max-width:280px;
}
.role-card .rc-desc{
  font-size:14px;
  line-height:1.6;
  color:var(--ink-2);
  margin-bottom:24px;
  max-width:340px;
}
.role-card .features{
  margin-bottom:28px;
}
.role-card .features li{
  padding:7px 0;
  border-bottom:1px dashed var(--rule-2);
  font-family:var(--f-mono);
  font-size:11.5px;
  letter-spacing:.02em;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  gap:10px;
}
.role-card .features li::before{
  content:'';
  width:6px;height:6px;
  background:var(--red);
  flex-shrink:0;
}
.role-card .rc-cta{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--f-display);
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:.01em;
  transition:color .15s;
}
.role-card .rc-cta svg{transition:transform .15s}
.role-card:hover .rc-cta svg{transform:translateX(4px)}

/* FEATURE STEPS */
.steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--ink);
  border-left:1px solid var(--ink);
}
.step{
  border-right:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  padding:28px 22px;
  min-height:200px;
  display:flex;
  flex-direction:column;
  background:var(--paper);
}
.step .sn{
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.12em;
  color:var(--red);
  margin-bottom:auto;
}
.step h4{
  font-size:16px;
  font-weight:700;
  letter-spacing:-.01em;
  margin:24px 0 10px;
  line-height:1.2;
}
.step p{
  font-size:13px;
  line-height:1.55;
  color:var(--ink-2);
}

/* QUOTE BAND */
.quote-band{
  background:var(--ink);
  color:var(--paper);
  padding:96px 32px;
  margin-top:0;
}
.quote-inner{
  max-width:900px;
  margin:0 auto;
}
.quote-band .ql{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--red-3);
  margin-bottom:32px;
}
.quote-band blockquote{
  font-family:var(--f-display);
  font-size:42px;
  font-weight:500;
  line-height:1.15;
  letter-spacing:-.03em;
  color:var(--paper);
}
.quote-band blockquote em{color:var(--red-3);font-style:normal;font-weight:800}
.quote-band cite{
  display:block;
  margin-top:36px;
  font-style:normal;
  font-family:var(--f-mono);
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-4);
  padding-top:24px;
  border-top:1px solid #2a2925;
}

/* CTA BAND */
.cta-band{
  max-width:var(--container);
  margin:0 auto;
  padding:80px 32px 100px;
}
.cta-inner{
  border:1px solid var(--ink);
  padding:56px 48px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:48px;
  align-items:center;
  background:var(--surface);
}
.cta-inner h2{
  font-size:38px;
  letter-spacing:-.035em;
  line-height:1.05;
  margin:14px 0 12px;
  max-width:560px;
}
.cta-inner p{
  font-size:15px;
  line-height:1.6;
  color:var(--ink-2);
  max-width:480px;
}

/* FOOTER */
.landing-footer{
  border-top:1px solid var(--ink);
  padding:36px 0;
  background:var(--paper);
}
.lf-inner{
  max-width:var(--container);
  margin:0 auto;
  padding:0 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:24px;
}
.lf-links{display:flex;gap:28px;flex-wrap:wrap}
.lf-links a{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
  transition:.12s;
}
.lf-links a:hover{color:var(--red)}
.lf-copy{
  font-family:var(--f-mono);
  font-size:11px;
  color:var(--ink-4);
  letter-spacing:.06em;
}

/* ============================================================
   AUTH
   ============================================================ */
#screen-auth{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
}
.auth-left{
  padding:40px 56px;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  border-right:1px solid var(--ink);
}
.auth-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-3);
  transition:.12s;
  width:fit-content;
  margin-bottom:auto;
}
.auth-back:hover{color:var(--red)}
.auth-form-wrap{
  max-width:420px;
  width:100%;
  margin:auto 0;
}
.auth-form-wrap h1{
  font-size:52px;
  letter-spacing:-.04em;
  line-height:1;
  font-weight:800;
  margin:20px 0 14px;
}
.auth-form-wrap .sub{
  font-size:14.5px;
  color:var(--ink-2);
  line-height:1.6;
  margin-bottom:36px;
}

.auth-tabs{
  display:flex;
  gap:0;
  margin-bottom:32px;
  border-bottom:1px solid var(--ink);
}
.auth-tab{
  padding:12px 0;
  margin-right:32px;
  font-family:var(--f-display);
  font-size:13px;
  font-weight:600;
  color:var(--ink-3);
  position:relative;
  letter-spacing:.01em;
  transition:.12s;
}
.auth-tab:hover{color:var(--ink-2)}
.auth-tab.active{color:var(--ink)}
.auth-tab.active::after{
  content:'';
  position:absolute;
  left:0;right:0;bottom:-1px;
  height:3px;
  background:var(--red);
}

.role-chips{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1px solid var(--ink);
  margin-bottom:24px;
}
.role-chip{
  padding:16px 10px;
  background:var(--paper);
  text-align:center;
  cursor:pointer;
  border-right:1px solid var(--ink);
  transition:.12s;
}
.role-chip:last-child{border-right:none}
.role-chip:hover{background:var(--paper-2)}
.role-chip.active{background:var(--ink);color:var(--paper)}
.role-chip .ic{
  display:grid;
  place-items:center;
  margin:0 auto 8px;
  height:20px;
}
.role-chip .nm{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.auth-error{
  padding:12px 16px;
  background:var(--red-soft);
  border:1px solid var(--red);
  color:var(--red);
  font-size:13px;
  line-height:1.5;
  margin-bottom:16px;
}
.auth-error:empty{display:none}

.auth-demo{
  margin-top:28px;
  padding:18px 20px;
  border:1px dashed var(--rule-3);
  background:var(--paper-2);
}
.auth-demo .l{
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:12px;
}
.auth-demo .demos{display:flex;flex-wrap:wrap;gap:8px}
.demo-pill{
  padding:6px 12px;
  background:var(--surface);
  border:1px solid var(--ink);
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:500;
  letter-spacing:.02em;
  color:var(--ink);
  transition:.12s;
}
.demo-pill:hover{background:var(--ink);color:var(--paper)}

.auth-right{
  padding:40px 56px;
  background:var(--paper-2);
  display:flex;
  flex-direction:column;
}
.auth-quote{margin:auto 0;max-width:480px}
.auth-quote .ql{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:24px;
}
.auth-quote blockquote{
  font-family:var(--f-display);
  font-size:32px;
  font-weight:500;
  line-height:1.2;
  letter-spacing:-.025em;
  color:var(--ink);
}
.auth-quote blockquote em{color:var(--red);font-style:normal;font-weight:800}
.auth-quote .who{
  margin-top:32px;
  padding-top:24px;
  border-top:1px solid var(--rule-2);
  display:flex;
  align-items:center;
  gap:14px;
}
.auth-quote .info b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.auth-quote .info span{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
}

.auth-stat-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:48px;
  padding-top:32px;
  border-top:1px solid var(--rule-2);
}
.auth-stat{
  padding-right:20px;
  border-right:1px solid var(--rule-2);
}
.auth-stat:last-child{border-right:none;padding-left:20px;padding-right:0}
.auth-stat:nth-child(2){padding-left:20px}
.auth-stat b{
  display:block;
  font-family:var(--f-display);
  font-size:32px;
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.auth-stat span{
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
  line-height:1.4;
}

/* ============================================================
   DASHBOARD SHELL
   ============================================================ */
#screen-app{min-height:100vh}
.dash-grid{
  display:grid;
  grid-template-columns:var(--sb-w) 1fr;
  min-height:100vh;
}

/* Sidebar */
.sidebar{
  background:var(--paper);
  border-right:1px solid var(--ink);
  padding:20px 0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:0}
.sb-brand{
  padding:0 20px 20px;
  border-bottom:1px solid var(--rule-2);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--f-display);
  font-weight:800;
  font-size:17px;
  letter-spacing:-.03em;
}
.sb-section{
  padding:14px 20px 8px;
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-4);
}
.sb-nav{display:flex;flex-direction:column;padding:0 12px}
.sb-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 8px;
  color:var(--ink-2);
  font-family:var(--f-display);
  font-size:13px;
  font-weight:600;
  letter-spacing:.005em;
  cursor:pointer;
  transition:.12s;
  position:relative;
  user-select:none;
}
.sb-item:hover{background:var(--paper-2);color:var(--ink)}
.sb-item.active{color:var(--ink);background:var(--paper-2)}
.sb-item.active::before{
  content:'';
  position:absolute;
  left:-12px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:20px;
  background:var(--red);
}
.sb-item .sb-ic{
  color:var(--ink-3);
  flex-shrink:0;
  display:grid;
  place-items:center;
  transition:.12s;
}
.sb-item:hover .sb-ic{color:var(--ink-2)}
.sb-item.active .sb-ic{color:var(--red)}
.sb-item .sb-badge{
  margin-left:auto;
  font-family:var(--f-mono);
  font-size:9.5px;
  font-weight:600;
  padding:2px 5px;
  background:var(--paper-2);
  color:var(--ink-3);
  line-height:1.4;
  min-width:16px;
  text-align:center;
}
.sb-item.active .sb-badge{background:var(--red);color:#fff}

.sb-spacer{flex:1;min-height:24px}
.sb-footer{padding:16px 12px 0;border-top:1px solid var(--rule-2);margin-top:16px}
.sb-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  cursor:pointer;
  position:relative;
  transition:.12s;
}
.sb-user:hover{background:var(--paper-2)}
.sb-user .who{min-width:0;flex:1}
.sb-user .who b{
  display:block;
  font-family:var(--f-display);
  font-size:12.5px;
  font-weight:700;
  letter-spacing:-.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:2px;
}
.sb-user .who span{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--ink-3);
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sb-popover{
  position:absolute;
  bottom:calc(100% + 6px);
  left:0;right:0;
  background:var(--surface);
  border:1px solid var(--ink);
  padding:4px;
  display:none;
  flex-direction:column;
  z-index:60;
}
.sb-popover.show{display:flex}
.sb-popover button{
  padding:9px 12px;
  font-family:var(--f-display);
  font-size:12.5px;
  font-weight:600;
  text-align:left;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  gap:10px;
  transition:.1s;
}
.sb-popover button:hover{background:var(--paper-2);color:var(--ink)}
.sb-popover .sep{height:1px;background:var(--rule);margin:4px 6px}

/* Main */
.dash-main{
  background:var(--paper);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  padding:0 32px;
  border-bottom:1px solid var(--ink);
  display:flex;
  align-items:center;
  gap:16px;
  height:64px;
  position:sticky;
  top:0;
  z-index:40;
  background:var(--paper);
  flex-shrink:0;
}
.tb-menu{
  display:none;
  width:34px;height:34px;
  border:1px solid var(--rule-2);
  place-items:center;
  color:var(--ink);
}
.tb-breadcrumb{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.tb-breadcrumb b{color:var(--ink);font-weight:600}
.tb-breadcrumb .sep{color:var(--rule-3)}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-date{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.06em;
  color:var(--ink-3);
  text-transform:uppercase;
  margin-right:12px;
}
.tb-icon{
  width:34px;height:34px;
  display:grid;place-items:center;
  border:1px solid var(--rule-2);
  color:var(--ink);
  position:relative;
  background:transparent;
  transition:.12s;
  flex-shrink:0;
}
.tb-icon:hover{background:var(--paper-2);border-color:var(--ink)}
.tb-icon .nd{
  position:absolute;
  top:-3px;right:-3px;
  width:8px;height:8px;
  background:var(--red);
  border:1.5px solid var(--paper);
}

.dash-body{
  flex:1;
  padding:40px 40px 80px;
  max-width:1400px;
  width:100%;
  min-width:0;
}

/* Page head */
.page-head{
  margin-bottom:32px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:32px;
  flex-wrap:wrap;
  padding-bottom:24px;
  border-bottom:1px solid var(--rule-2);
}
.page-head .ph-main{flex:1;min-width:0;max-width:820px}
.page-head .ph-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.page-head h1{
  font-size:48px;
  line-height:1.02;
  letter-spacing:-.04em;
  font-weight:800;
  margin-bottom:12px;
}
.page-head .ph-sub{
  font-size:15px;
  color:var(--ink-2);
  line-height:1.6;
  max-width:680px;
}
.page-head .ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   STATS BLOCK
   ============================================================ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--ink);
  border-left:1px solid var(--ink);
  margin-bottom:40px;
}
.stat-box{
  border-right:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  padding:22px 24px;
  background:var(--paper);
  transition:.15s;
}
.stat-box:hover{background:var(--paper-2)}
.stat-box .sl{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.stat-box .sl .dot{
  width:6px;height:6px;
  background:var(--red);
  flex-shrink:0;
}
.stat-box .sv{
  font-family:var(--f-display);
  font-size:44px;
  font-weight:800;
  letter-spacing:-.04em;
  line-height:.9;
  margin-bottom:12px;
  font-variant-numeric:tabular-nums;
  display:flex;
  align-items:baseline;
  gap:6px;
}
.stat-box .sv small{
  font-size:14px;
  font-weight:600;
  color:var(--ink-3);
  letter-spacing:0;
  font-family:var(--f-mono);
}
.stat-box .sd{
  font-size:12.5px;
  color:var(--ink-3);
  line-height:1.4;
}
.stat-box .sd .up{color:var(--green);font-weight:600}
.stat-box .sd .down{color:var(--red);font-weight:600}

/* ============================================================
   PANELS
   ============================================================ */
.panel{
  border:1px solid var(--ink);
  background:var(--surface);
  overflow:hidden;
}
.panel-head{
  padding:18px 22px;
  border-bottom:1px solid var(--ink);
  display:flex;
  align-items:center;
  gap:16px;
  min-height:64px;
  background:var(--paper-2);
}
.panel-head h2{
  font-family:var(--f-mono);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink);
}
.panel-head .ph-meta{
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.06em;
  color:var(--ink-3);
  text-transform:uppercase;
}
.panel-head .ph-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel-body{padding:22px}
.panel-body.flush{padding:0}
.panel-body.tight{padding:16px}

.layout-2{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;margin-bottom:32px}
.layout-2.eq{grid-template-columns:1fr 1fr}
.layout-side{display:flex;flex-direction:column;gap:24px}

/* ============================================================
   TASK ROWS
   ============================================================ */
.task-list{
  display:flex;
  flex-direction:column;
}
.task-row{
  padding:22px 24px;
  border-bottom:1px solid var(--rule);
  cursor:pointer;
  transition:.12s;
  position:relative;
  background:var(--surface);
}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--paper-2)}
.task-row:hover::before{width:3px}
.task-row::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:0;
  background:var(--red);
  transition:.15s;
}
.task-row .tr-inner{
  display:flex;
  gap:24px;
  align-items:flex-start;
  padding-left:8px;
}
.task-row .tr-main{flex:1;min-width:0}
.task-row .tr-title{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.task-row h3{
  font-family:var(--f-display);
  font-size:17px;
  font-weight:700;
  letter-spacing:-.015em;
  line-height:1.25;
}
.task-row .tr-desc{
  font-size:13.5px;
  color:var(--ink-2);
  line-height:1.6;
  margin-bottom:12px;
  max-width:680px;
}
.task-row .tr-meta{
  display:flex;
  align-items:center;
  gap:14px;
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.04em;
  color:var(--ink-3);
  flex-wrap:wrap;
}
.task-row .tr-meta .dot{
  width:3px;height:3px;
  background:var(--ink-4);
  flex-shrink:0;
}
.task-row .tr-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
}
.task-row .tr-side{
  flex-shrink:0;
  text-align:right;
  min-width:130px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
}
.task-row .tr-price{
  font-family:var(--f-display);
  font-size:20px;
  font-weight:800;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.task-row .tr-price.muted{color:var(--ink-3);font-weight:600}
.task-row .tr-match{
  display:flex;
  align-items:center;
  gap:6px;
  font-family:var(--f-mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--red);
}
.task-row .tr-match.good{color:var(--green)}
.task-row .tr-match.mid{color:var(--yellow)}
.task-row .tr-status{
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* ============================================================
   CANDIDATES
   ============================================================ */
.cand-list{display:flex;flex-direction:column}
.cand-row{
  padding:16px 24px;
  border-bottom:1px solid var(--rule);
  display:flex;
  gap:16px;
  align-items:center;
  cursor:pointer;
  transition:.12s;
  background:var(--surface);
  position:relative;
}
.cand-row:last-child{border-bottom:none}
.cand-row:hover{background:var(--paper-2)}
.cand-row:hover::before{width:3px}
.cand-row::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:0;
  background:var(--red);
  transition:.15s;
}
.cand-row .who{flex:1;min-width:0}
.cand-row .who b{
  display:block;
  font-family:var(--f-display);
  font-size:14.5px;
  font-weight:700;
  letter-spacing:-.01em;
  margin-bottom:3px;
}
.cand-row .who p{
  font-size:12px;
  color:var(--ink-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:var(--f-mono);
  letter-spacing:.02em;
}
.cand-row .stats{
  display:flex;
  gap:24px;
  flex-shrink:0;
  align-items:center;
}
.cand-row .stats .st{text-align:right}
.cand-row .stats .st .v{
  font-family:var(--f-display);
  font-size:18px;
  font-weight:800;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.cand-row .stats .st .v.red{color:var(--red)}
.cand-row .stats .st .v.green{color:var(--green)}
.cand-row .stats .st .k{
  font-family:var(--f-mono);
  font-size:9.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-4);
  margin-top:3px;
}

/* ============================================================
   ACTIVITY FEED
   ============================================================ */
.feed{display:flex;flex-direction:column}
.feed-row{
  display:flex;
  gap:14px;
  padding:14px 22px;
  border-bottom:1px solid var(--rule);
  align-items:flex-start;
  background:var(--surface);
  font-size:13.5px;
  line-height:1.55;
  transition:.12s;
}
.feed-row:last-child{border-bottom:none}
.feed-row:hover{background:var(--paper-2)}
.feed-row .fi{
  width:22px;height:22px;
  flex-shrink:0;
  display:grid;place-items:center;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--f-mono);
  font-size:9px;
  font-weight:700;
  margin-top:1px;
}
.feed-row .fi.red{background:var(--red)}
.feed-row .fi.green{background:var(--green)}
.feed-row .fi.yellow{background:var(--yellow)}
.feed-row .fi.paper{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule-2)}
.feed-row .fb{flex:1;min-width:0}
.feed-row .fb p{color:var(--ink-2)}
.feed-row .fb p b{color:var(--ink);font-weight:600}
.feed-row .fb p a{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.feed-row .ft{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.05em;
  color:var(--ink-4);
  flex-shrink:0;
  text-transform:uppercase;
  margin-top:3px;
}

/* ============================================================
   SKILL GRAPH
   ============================================================ */
.graph-wrap{
  background:var(--surface);
  border:1px solid var(--rule-2);
  padding:16px;
  position:relative;
  overflow:hidden;
}
.graph-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.graph-wrap.sm{padding:10px}

.legend-bar{
  display:flex;
  gap:24px;
  padding:14px 20px;
  border-bottom:1px solid var(--rule);
  background:var(--paper-2);
  font-family:var(--f-mono);
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-3);
  flex-wrap:wrap;
}
.legend-bar .li{display:flex;align-items:center;gap:8px}
.legend-bar .sq{width:10px;height:10px;flex-shrink:0}
.legend-bar .sq.v{background:var(--green)}
.legend-bar .sq.p{background:var(--yellow)}
.legend-bar .sq.n{background:var(--ink-4)}

.graph-svg .node{cursor:pointer;transition:opacity .2s}
.graph-svg .node rect{transition:filter .15s}
.graph-svg .node:hover rect{filter:brightness(1.05) contrast(1.1)}
.graph-svg .node.dim{opacity:.22}
.graph-svg .edge{fill:none;stroke:var(--rule-2);stroke-width:1.3;transition:stroke .2s,stroke-width .2s,opacity .2s}
.graph-svg .edge.active{stroke:var(--red);stroke-width:2}
.graph-svg .edge.dim{opacity:.15}
.graph-svg text{font-family:'Inter',sans-serif;font-weight:500;pointer-events:none;user-select:none}

.evi-list{display:flex;flex-direction:column;gap:0}
.evi-item{
  padding:14px 18px;
  border-bottom:1px solid var(--rule);
  display:flex;
  gap:14px;
  align-items:flex-start;
  background:var(--surface);
}
.evi-item:last-child{border-bottom:none}
.evi-item .ic{
  width:28px;height:28px;
  flex-shrink:0;
  display:grid;place-items:center;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
}
.evi-item .ic.red{background:var(--red)}
.evi-item .ic.green{background:var(--green)}
.evi-item .ic.yellow{background:var(--yellow)}
.evi-item .body{flex:1;min-width:0}
.evi-item .body b{
  display:block;
  font-family:var(--f-display);
  font-size:13.5px;
  font-weight:700;
  margin-bottom:4px;
  letter-spacing:-.01em;
}
.evi-item .body p{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.evi-item .score{
  font-family:var(--f-mono);
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  flex-shrink:0;
}

/* ============================================================
   AI BARS
   ============================================================ */
.ai-bars{display:flex;flex-direction:column;gap:18px}
.ai-bar-row .l{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:8px;
  gap:12px;
}
.ai-bar-row .l b{
  font-family:var(--f-display);
  font-size:13px;
  font-weight:600;
  color:var(--ink-2);
  letter-spacing:-.005em;
}
.ai-bar-row .l .v{
  font-family:var(--f-mono);
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.ai-bar-row .bar{
  height:4px;
  background:var(--paper-2);
  overflow:hidden;
  border:1px solid var(--rule);
}
.ai-bar-row .bar i{
  display:block;
  height:100%;
  background:var(--red);
  width:0;
  transition:width 1s cubic-bezier(.16,1,.3,1);
}
.ai-bar-row .bar i.green{background:var(--green)}
.ai-bar-row .bar i.yellow{background:var(--yellow)}
.ai-bar-row .bar i.ink{background:var(--ink)}

/* ============================================================
   COURSES
   ============================================================ */
.course-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:0;
  border-top:1px solid var(--ink);
  border-left:1px solid var(--ink);
}
.course-card{
  border-right:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
  background:var(--surface);
  cursor:pointer;
  transition:.15s;
  display:flex;
  flex-direction:column;
  min-height:280px;
  position:relative;
  overflow:hidden;
}
.course-card:hover{background:var(--paper-2)}
.course-card:hover .cc-thumb::after{transform:translateX(100%)}
.cc-thumb{
  height:100px;
  background:var(--paper-2);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--ink);
  padding:16px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.cc-thumb::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(209,62,38,.08),transparent);
  transition:transform .6s;
  pointer-events:none;
}
.cc-thumb .num{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.14em;
  color:var(--red);
  position:relative;
  z-index:1;
}
.cc-thumb .status-pill{
  font-family:var(--f-mono);
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 8px;
  background:var(--green);
  color:var(--paper);
  position:relative;
  z-index:1;
}
.cc-thumb .status-pill.draft{background:var(--ink-4);color:var(--paper)}
.cc-body{
  padding:20px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.cc-body h3{
  font-family:var(--f-display);
  font-size:17px;
  font-weight:700;
  letter-spacing:-.015em;
  line-height:1.25;
}
.cc-body .cc-desc{
  font-size:12.5px;
  color:var(--ink-3);
  line-height:1.5;
}
.cc-meta{
  margin-top:auto;
  padding-top:14px;
  border-top:1px dashed var(--rule-2);
  display:flex;
  justify-content:space-between;
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.04em;
  color:var(--ink-3);
  text-transform:uppercase;
}
.cc-meta .price{
  font-family:var(--f-display);
  font-size:14px;
  font-weight:800;
  letter-spacing:-.02em;
  color:var(--ink);
  text-transform:none;
  font-variant-numeric:tabular-nums;
}

.cc-progress{
  height:3px;
  background:var(--paper-2);
  margin-top:10px;
  overflow:hidden;
}
.cc-progress i{
  display:block;
  height:100%;
  background:var(--red);
  transition:width .5s;
}

/* ============================================================
   LESSONS
   ============================================================ */
.lesson-list{
  display:flex;
  flex-direction:column;
  border:1px solid var(--rule-2);
  background:var(--surface);
}
.lesson-row{
  padding:14px 18px;
  border-bottom:1px solid var(--rule);
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  transition:.12s;
}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:var(--paper-2)}
.lesson-row .ln{
  font-family:var(--f-mono);
  font-size:11px;
  font-weight:600;
  color:var(--ink-4);
  letter-spacing:.06em;
  width:28px;
  flex-shrink:0;
}
.lesson-row .lt{
  flex:1;
  font-family:var(--f-display);
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
}
.lesson-row .ld{
  font-family:var(--f-mono);
  font-size:11px;
  color:var(--ink-3);
  letter-spacing:.04em;
  flex-shrink:0;
}
.lesson-row .lchk{
  width:20px;height:20px;
  border:1px solid var(--rule-3);
  flex-shrink:0;
  display:grid;place-items:center;
  color:transparent;
}
.lesson-row.done .lchk{
  background:var(--green);
  border-color:var(--green);
  color:var(--paper);
}
.lesson-row.done .lt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}

/* ============================================================
   CHAT
   ============================================================ */
.chat-layout{
  display:grid;
  grid-template-columns:320px 1fr;
  border:1px solid var(--ink);
  height:calc(100vh - 220px);
  min-height:540px;
  background:var(--surface);
}
.chat-convs{
  border-right:1px solid var(--ink);
  overflow-y:auto;
  background:var(--paper);
}
.chat-convs::-webkit-scrollbar{width:0}
.chat-conv{
  padding:16px 20px;
  border-bottom:1px solid var(--rule);
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:.12s;
  position:relative;
}
.chat-conv:hover{background:var(--paper-2)}
.chat-conv.active{background:var(--paper-2)}
.chat-conv.active::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:var(--red);
}
.chat-conv .body{flex:1;min-width:0}
.chat-conv .body b{
  display:block;
  font-family:var(--f-display);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:-.01em;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-conv .body p{
  font-size:12px;
  color:var(--ink-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-conv .meta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  flex-shrink:0;
}
.chat-conv .meta .t{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.04em;
  color:var(--ink-4);
}
.chat-conv .meta .unread{
  background:var(--red);
  color:#fff;
  font-family:var(--f-mono);
  font-size:9.5px;
  font-weight:700;
  padding:2px 6px;
  letter-spacing:.04em;
  min-width:16px;
  text-align:center;
}

.chat-main{
  display:flex;
  flex-direction:column;
  background:var(--surface);
  min-width:0;
}
.chat-head{
  padding:14px 24px;
  border-bottom:1px solid var(--ink);
  display:flex;
  gap:12px;
  align-items:center;
  background:var(--paper-2);
  min-height:64px;
}
.chat-head .who b{
  display:block;
  font-family:var(--f-display);
  font-size:14px;
  font-weight:700;
  margin-bottom:2px;
  letter-spacing:-.01em;
}
.chat-head .who span{
  font-family:var(--f-mono);
  font-size:10.5px;
  color:var(--ink-3);
  letter-spacing:.05em;
  text-transform:uppercase;
}

.chat-msgs{
  flex:1;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:var(--surface);
}
.chat-msgs::-webkit-scrollbar{width:0}

.chat-day{
  text-align:center;
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-4);
  padding:10px 0;
  display:flex;
  align-items:center;
  gap:16px;
}
.chat-day::before,
.chat-day::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--rule);
}

.chat-msg{
  max-width:68%;
  padding:11px 16px;
  font-size:13.5px;
  line-height:1.5;
  word-wrap:break-word;
  position:relative;
}
.chat-msg.mine{
  background:var(--ink);
  color:var(--paper);
  align-self:flex-end;
}
.chat-msg.their{
  background:var(--paper-2);
  border:1px solid var(--rule);
  align-self:flex-start;
  color:var(--ink);
}
.chat-msg .meta{
  font-family:var(--f-mono);
  font-size:9.5px;
  letter-spacing:.06em;
  margin-top:6px;
  opacity:.55;
}

.chat-input{
  padding:16px 24px;
  border-top:1px solid var(--ink);
  display:flex;
  gap:12px;
  background:var(--paper-2);
  align-items:flex-end;
}
.chat-input textarea{
  flex:1;
  padding:11px 14px;
  background:var(--surface);
  border:1px solid var(--rule-2);
  color:var(--ink);
  font-size:13.5px;
  resize:none;
  min-height:42px;
  max-height:120px;
  line-height:1.5;
  font-family:var(--f-body);
  transition:.12s;
}
.chat-input textarea:focus{outline:none;border-color:var(--ink);background:#fff}
.chat-input textarea::placeholder{color:var(--ink-4)}

/* ============================================================
   MODAL
   ============================================================ */
.modal-bg{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(15,15,13,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);
  border:1px solid var(--ink);
  max-width:640px;
  width:100%;
  max-height:92vh;
  overflow-y:auto;
  position:relative;
  animation:modalIn .18s ease-out;
}
.modal.wide{max-width:840px}
.modal.narrow{max-width:480px}
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:var(--rule-2)}
@keyframes modalIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.modal-head{
  padding:22px 26px;
  border-bottom:1px solid var(--ink);
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--paper-2);
  position:sticky;
  top:0;
  z-index:2;
}
.modal-head h2{
  font-family:var(--f-display);
  font-size:22px;
  font-weight:800;
  letter-spacing:-.025em;
  line-height:1.1;
  flex:1;
  min-width:0;
}
.modal-head .close{
  width:32px;height:32px;
  display:grid;place-items:center;
  color:var(--ink);
  transition:.12s;
  flex-shrink:0;
  border:1px solid transparent;
}
.modal-head .close:hover{background:var(--paper-3);border-color:var(--rule-2)}

.modal-body{padding:24px 26px}
.modal-body.flush{padding:0}
.modal-foot{
  padding:18px 26px;
  border-top:1px solid var(--ink);
  display:flex;
  justify-content:flex-end;
  gap:10px;
  background:var(--paper-2);
  flex-wrap:wrap;
  position:sticky;
  bottom:0;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-host{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:300;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
  max-width:420px;
}
.toast{
  padding:14px 18px;
  background:var(--ink);
  color:var(--paper);
  font-size:13.5px;
  font-weight:500;
  min-width:240px;
  animation:toastIn .22s ease-out;
  pointer-events:auto;
  border-left:4px solid var(--ink);
  line-height:1.5;
}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.toast.info{border-left-color:var(--yellow)}
@keyframes toastIn{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:none}
}

/* ============================================================
   EMPTY / LOADER
   ============================================================ */
.empty{
  padding:72px 30px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.empty .ei{
  width:56px;height:56px;
  border:1px solid var(--rule-2);
  background:var(--paper-2);
  display:grid;place-items:center;
  color:var(--ink-3);
  margin-bottom:20px;
}
.empty h3{
  font-family:var(--f-display);
  font-size:20px;
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:8px;
}
.empty p{
  font-size:13.5px;
  color:var(--ink-3);
  margin-bottom:22px;
  max-width:380px;
  line-height:1.6;
}

.a-spin{
  width:32px;height:32px;
  border:2px solid var(--rule-2);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.a-loader{
  padding:40px 20px;
  text-align:center;
}
.a-loader .lbl{
  font-family:var(--f-mono);
  font-size:11.5px;
  color:var(--ink-3);
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* ============================================================
   ANALYSIS OUTPUT
   ============================================================ */
.a-source{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:5px 10px;
  background:var(--paper-2);
  border:1px solid var(--rule-2);
  color:var(--ink-3);
}
.a-source.live{
  color:var(--green);
  border-color:rgba(30,77,58,.35);
  background:var(--green-soft);
}
.a-source .d{width:6px;height:6px;background:currentColor}

.a-summary{
  padding:18px 22px;
  background:var(--paper-2);
  border-left:3px solid var(--red);
  font-size:14px;
  line-height:1.65;
  color:var(--ink-2);
  margin-bottom:24px;
}
.a-summary b{color:var(--ink);font-weight:600}

.a-sec{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin:22px 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--rule);
}
.a-sec:first-child{margin-top:0}

.a-mods{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:0;
  border-top:1px solid var(--rule);
  border-left:1px solid var(--rule);
}
.a-mod{
  border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  padding:14px 16px;
  background:var(--surface);
}
.a-mod h4{
  font-family:var(--f-display);
  font-size:13.5px;
  font-weight:700;
  margin-bottom:6px;
  letter-spacing:-.01em;
}
.a-mod p{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-bottom:10px}

.a-chips{display:flex;gap:6px;flex-wrap:wrap}

.a-risks{display:flex;flex-direction:column}
.a-risk{
  display:flex;
  gap:14px;
  padding:12px 16px;
  background:var(--surface);
  border:1px solid var(--rule);
  border-bottom:none;
  font-size:13.5px;
  color:var(--ink-2);
  line-height:1.5;
  align-items:flex-start;
}
.a-risk:last-child{border-bottom:1px solid var(--rule)}
.a-risk .rk{
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 8px;
  background:var(--paper-2);
  border:1px solid var(--rule-2);
  color:var(--ink-3);
  flex-shrink:0;
  min-width:64px;
  text-align:center;
}
.a-risk .rk.high{background:var(--red-soft);color:var(--red);border-color:rgba(209,62,38,.35)}
.a-risk .rk.mid{background:var(--yellow-soft);color:var(--yellow);border-color:rgba(201,138,10,.35)}
.a-risk .rk.low{background:var(--green-soft);color:var(--green);border-color:rgba(30,77,58,.35)}

.a-error{
  padding:14px 18px;
  background:var(--red-soft);
  border:1px solid var(--red);
  color:var(--red);
  font-size:13px;
  line-height:1.55;
}
.a-error b{display:block;margin-bottom:4px;font-weight:700;color:var(--red-2)}

/* ============================================================
   TABLE
   ============================================================ */
.table{width:100%;font-size:13.5px}
.table th{
  text-align:left;
  padding:14px 22px;
  background:var(--paper-2);
  border-bottom:1px solid var(--ink);
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  white-space:nowrap;
}
.table td{
  padding:16px 22px;
  border-bottom:1px solid var(--rule);
  color:var(--ink-2);
  vertical-align:middle;
}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--paper-2)}
.table td b{color:var(--ink);font-weight:600}
.table td.num{
  font-family:var(--f-mono);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  text-align:right;
}

function fmtRel(ts){
  if(!ts) return '';
  const diff = Date.now() - +ts;
  const min=60000, hr=60*min, day=24*hr;
  if(diff<min) return 'только что';
  if(diff<hr) return Math.floor(diff/min)+' мин';
  if(diff<day) return Math.floor(diff/hr)+' ч';
  if(diff<7*day) return Math.floor(diff/day)+' дн';
  return fmtDate(ts);
}

  let h=0;
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;

}

  const host=$('#modalHost'), content=$('#modalContent');

function seedIfEmpty(){
  if(store.get(K.seeded)) return;

  const skills = SEED.skills.map(([name,category],i)=>({id:'s_'+(i+1),name,category,created_at:Date.now()}));
  store.set(K.skills,skills);
  const byName = Object.fromEntries(skills.map(s=>[s.name,s]));
  const edges = [];
  SEED.skills.forEach(([name,cat,parent])=>{
    if(!parent) return;
    const p=byName[parent], c=byName[name];
    if(p&&c) edges.push({id:'e_'+edges.length,parent_id:p.id,child_id:c.id});
  });
  store.set(K.edges,edges);

  store.set(K.users,SEED.users.map(u=>({...u,created_at:Date.now()})));

  const userSkills=[], evidence=[];
  Object.entries(SEED.userSkills).forEach(([uid_,list])=>{
    list.forEach(([name,level,score],i)=>{
      const s=byName[name];
      if(!s) return;
      const usId='us_'+uid_+'_'+i;
      userSkills.push({id:usId,user_id:uid_,skill_id:s.id,level,score,created_at:Date.now(),updated_at:Date.now()});
      evidence.push({id:'ev_'+usId+'_1',user_skill_id:usId,kind:'task',title:`Задача №${10+i}: ${name}`,description:'Практическое задание, проверено независимо',score,created_at:Date.now()});
      if(score>=80) evidence.push({id:'ev_'+usId+'_2',user_skill_id:usId,kind:'review',title:'Код-ревью',description:'Подтверждено ментором',score,created_at:Date.now()});
    });
  });
  store.set(K.userSkills,userSkills);
  store.set(K.evidence,evidence);
  store.set(K.tasks,SEED.tasks);
  store.set(K.apps,SEED.applications);
  store.set(K.courses,SEED.courses);
  store.set(K.modules,SEED.modules);
  store.set(K.lessons,SEED.lessons);
  store.set(K.enrollments,SEED.enrollments);
  store.set(K.lessonDone,SEED.lessonDone);
  store.set(K.convs,SEED.convs);
  store.set(K.messages,SEED.messages);
  store.set(K.seeded,true);
}

   ============================================================================ */
const state = { user:null, route:'landing', params:[], currentConv:null };

function parseHash(){
  const raw=location.hash.replace(/^#\/?/,'');
  const [path,...params]=raw.split('/');
  return { path:path||'landing', params };
}
const go = p => location.hash='#/'+p.replace(/^\/+/,'');

function route(){
  const {path,params}=parseHash();
  state.route=path; state.params=params;
  const hasSess=!!state.user;

  if(['app'].includes(path)&&!hasSess) return go('login');
  if(['login','register'].includes(path)&&hasSess) return go('app');

  const sb=$('#sidebar'); if(sb) sb.classList.remove('open');

  switch(path){
    case 'landing': return renderLanding();
    case 'login': return renderAuth('signin');
    case 'register': return renderAuth('signup');
    case 'app': return renderApp(params[0]||'home', params.slice(1));
    default: return renderLanding();
  }
}

function bindAuth(){
  $$('.auth-tab').forEach(t=>t.addEventListener('click',()=>renderAuth(t.dataset.authtab)));
  $$('.role-chip').forEach(c=>c.addEventListener('click',()=>{
    authState.role=c.dataset.role;
    $$('.role-chip').forEach(x=>x.classList.toggle('active',x===c));
    updateAuthQuote();
  }));

  $$('.demo-pill').forEach(p=>p.addEventListener('click',()=>{
    $('#fEmail').value=p.dataset.email;
    $('#fPass').value='demo';
    $('#authForm').requestSubmit();
  }));

  $('#authForm').addEventListener('submit',e=>{
    e.preventDefault();
    const err=$('#authError');
    err.textContent='';
    const email=$('#fEmail').value.trim().toLowerCase();
    const password=$('#fPass').value;
    const name=$('#fName').value.trim();

    if(!email) return err.textContent='Введите email';
    if(!password||password.length<4) return err.textContent='Пароль минимум 4 символа';

    const users=db.users();

    if(authState.mode==='signin'){
      const u=users.find(x=>x.email.toLowerCase()===email);
      if(!u) return err.textContent='Пользователь не найден';
      if(u.password!==password) return err.textContent='Неверный пароль';
      loginAs(u);
    } else {
      if(!name) return err.textContent='Введите имя';
      if(users.find(x=>x.email.toLowerCase()===email)) return err.textContent='Email уже зарегистрирован';
      const nu={id:uid('u'),email,password,name,role:authState.role,title:roleLabel(authState.role),location:'',years:0,bio:'',created_at:Date.now()};
      users.push(nu);
      db.saveUsers(users);
      loginAs(nu);
    }
  });
}

function getNavBadge(id,role){
  const me=state.user; if(!me) return '';
  if(id==='tasks'){
    const n=role==='customer'?db.tasks().filter(t=>t.customer_id===me.id).length:db.tasks().filter(t=>t.status==='open').length;
    return n||'';
  }
  if(id==='applications') return db.apps().filter(a=>a.specialist_id===me.id).length||'';
  if(id==='chat'){
    const convs=db.convs().filter(c=>c.user_a===me.id||c.user_b===me.id);
    const unread=convs.reduce((s,c)=>s+db.messages().filter(m=>m.conversation_id===c.id&&m.sender_id!==me.id&&!m.read_at).length,0);
    return unread||'';
  }
  if(id==='courses'&&role==='creator') return db.courses().filter(c=>c.creator_id===me.id).length||'';
  return '';
}

function getUnreadCount(){
  const me=state.user; if(!me) return 0;
  const convs=db.convs().filter(c=>c.user_a===me.id||c.user_b===me.id);
  return convs.reduce((s,c)=>s+db.messages().filter(m=>m.conversation_id===c.id&&m.sender_id!==me.id&&!m.read_at).length,0);
}

function bindShell(){
  $$('.sb-item').forEach(el=>el.addEventListener('click',()=>go('app/'+el.dataset.section)));

  const sbU=$('#sbUser'), pop=$('#sbPopover');
  if(sbU&&pop){
    sbU.addEventListener('click',e=>{ if(e.target.closest('.sb-popover')) return; pop.classList.toggle('show'); });
    document.addEventListener('click',e=>{ if(!e.target.closest('#sbUser')) pop.classList.remove('show'); });
    pop.querySelector('[data-logout]')?.addEventListener('click',logout);
    pop.querySelector('[data-nav="settings"]')?.addEventListener('click',()=>go('app/settings'));
    pop.querySelector('[data-nav="profile"]')?.addEventListener('click',()=>{
      if(state.user.role==='specialist') go('app/graph'); else go('app/settings');
    });
  }

  $('#tbMenu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#tbNotif')?.addEventListener('click',openNotifications);
  $('#tbSearch')?.addEventListener('click',openSearch);

  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
  });
}

function computeMatch(task,userId){
  const us=db.userSkills().filter(x=>x.user_id===userId);
  const map=new Map(us.map(x=>[x.skill_id,x.level]));
  const byName=Object.fromEntries(db.skills().map(s=>[s.name,s.id]));
  let total=0, matched=0;
  for(const [name,req] of (task.skills||[])){
    const id=byName[name]; if(!id) continue;
    const w=req?2:1; total+=w;
    const lvl=map.get(id);
    if(lvl==='verified') matched+=w;
    else if(lvl==='practicing') matched+=w*0.6;
    else if(lvl==='planned') matched+=w*0.3;
  }
  return total>0?Math.round((matched/total)*100):50;
}

function buildUserGraph(userId){
  const us=db.userSkills().filter(x=>x.user_id===userId);
  const byId=Object.fromEntries(db.skills().map(s=>[s.id,s]));
  const evByUs={};
  db.evidence().forEach(e=>{ (evByUs[e.user_skill_id]=evByUs[e.user_skill_id]||[]).push(e); });
  const nodes=us.map(x=>{
    const s=byId[x.skill_id];
    return {id:x.id,skill_id:x.skill_id,name:s.name,category:s.category,level:x.level,score:x.score,updated_at:x.updated_at,evidence:evByUs[x.id]||[]};
  });
  const ids=new Set(nodes.map(n=>n.skill_id));
  const edges=db.edges().filter(e=>ids.has(e.parent_id)&&ids.has(e.child_id));
  return {user:db.users().find(u=>u.id===userId),nodes,edges};
}

/* ============================================================================
   18. SKILL GRAPH RENDERER
   ============================================================================ */
const SVGNS='http://www.w3.org/2000/svg';

function renderSkillGraph(container,data,opts={}){
  const {nodes,edges}=data;
  if(!nodes.length){ container.innerHTML=''; return; }
  const H=opts.height||700, compact=!!opts.compact, W=900;

  const nodeById=Object.fromEntries(nodes.map(n=>[n.skill_id,n]));
  const children={};
  edges.forEach(e=>{ (children[e.parent_id]=children[e.parent_id]||[]).push(e.child_id); });
  const hasParent=new Set(edges.map(e=>e.child_id));
  const roots=nodes.filter(n=>!hasParent.has(n.skill_id));

  const COLS=compact?[70,200,340]:[110,340,620];
  const pos=new Map();
  const ROW_H=compact?44:56;

  function assign(node,depth,y){
    const x=COLS[Math.min(depth,COLS.length-1)];
    pos.set(node.skill_id,{x,y,depth});
    const kids=children[node.skill_id]||[];
    if(!kids.length) return;
    const startY=y-(kids.length-1)*ROW_H/2;
    kids.forEach((kidId,i)=>{
      const k=nodeById[kidId];
      if(k) assign(k,depth+1,startY+i*ROW_H);
    });
  }

  roots.forEach((r,i)=>{
    const seg=H/Math.max(1,roots.length);
    assign(r,0,i*seg+seg/2);
  });

  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.classList.add('graph-svg');
  svg.style.maxHeight=H+'px';

  const wFor=(label,kind)=>Math.max(compact?60:90,label.length*(compact?6.5:8)+(kind==='root'?44:34));
  const hFor=kind=>kind==='root'?(compact?26:40):(compact?22:32);
  const kindOf=node=>!hasParent.has(node.skill_id)?'root':((children[node.skill_id]?.length)?'cat':'sub');
  const colorOf=node=>node.level==='verified'?'#1e4d3a':node.level==='practicing'?'#c98a0a':'#a5a19a';

  const edgeG=document.createElementNS(SVGNS,'g');
  edges.forEach(e=>{
    const a=pos.get(e.parent_id),b=pos.get(e.child_id);
    const na=nodeById[e.parent_id],nb=nodeById[e.child_id];
    if(!a||!b||!na||!nb) return;
    const x1=a.x+wFor(na.name,kindOf(na))/2, y1=a.y;
    const x2=b.x-wFor(nb.name,kindOf(nb))/2, y2=b.y;
    const mx=(x1+x2)/2;
    const p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d',`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    p.setAttribute('class','edge');
    p.dataset.from=e.parent_id; p.dataset.to=e.child_id;
    edgeG.appendChild(p);
  });
  svg.appendChild(edgeG);

  const nodeG=document.createElementNS(SVGNS,'g');
  nodes.forEach(n=>{
    const p=pos.get(n.skill_id); if(!p) return;
    const kind=kindOf(n);
    const w=wFor(n.name,kind), h=hFor(kind);
    const g=document.createElementNS(SVGNS,'g');
    g.setAttribute('class','node '+kind);
    g.dataset.skillId=n.skill_id;

    const r=document.createElementNS(SVGNS,'rect');
    r.setAttribute('x',p.x-w/2); r.setAttribute('y',p.y-h/2);
    r.setAttribute('width',w); r.setAttribute('height',h);

    let fill='#faf8f2', stroke='#c8c3b4';
    if(kind==='root'){ fill='#0f0f0d'; stroke='#0f0f0d'; }
    else if(kind==='cat'){ fill='#f5f2e8'; stroke='#c8c3b4'; }
    if(kind!=='root'){
      if(n.level==='verified') stroke='#1e4d3a';
      else if(n.level==='practicing') stroke='#c98a0a';
      else if(n.level==='planned'){ stroke='#d9d5c8'; r.setAttribute('stroke-dasharray','3 3'); }
    }
    r.setAttribute('fill',fill); r.setAttribute('stroke',stroke); r.setAttribute('stroke-width',kind==='root'?'0':'1.5');
    g.appendChild(r);

    const dot=document.createElementNS(SVGNS,'circle');
    dot.setAttribute('cx',p.x-w/2+h/2-2);
    dot.setAttribute('cy',p.y);
    dot.setAttribute('r',compact?'2.5':'3.5');
    dot.setAttribute('fill',kind==='root'?'#d13e26':colorOf(n));
    g.appendChild(dot);

    const t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',p.x+4);
    t.setAttribute('y',p.y+(compact?3.5:4.5));
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size',kind==='root'?(compact?10:14):kind==='cat'?(compact?10:13):(compact?9.5:12));
    t.setAttribute('fill',kind==='root'?'#f2efe6':kind==='cat'?'#0f0f0d':'#3d3b36');
    t.setAttribute('font-weight',kind==='root'?'700':kind==='cat'?'600':'500');
    t.textContent=n.name;
    g.appendChild(t);

    g.addEventListener('click',()=>opts.onSelect?.(n));
    g.addEventListener('mouseenter',()=>hlNeighbors(g,n.skill_id,edges,true));
    g.addEventListener('mouseleave',()=>hlNeighbors(g,n.skill_id,edges,false));
    nodeG.appendChild(g);
  });
  svg.appendChild(nodeG);

  container.innerHTML='';
  container.appendChild(svg);
}

function hlNeighbors(target,skillId,edges,on){
  const svg=target.ownerSVGElement; if(!svg) return;
  const rel=new Set([skillId]);
  edges.forEach(e=>{
    if(e.parent_id===skillId) rel.add(e.child_id);
    if(e.child_id===skillId) rel.add(e.parent_id);
  });
  $$('.node',svg).forEach(n=>{
    if(!on) n.classList.remove('dim');
    else n.classList.toggle('dim',!rel.has(+n.dataset.skillId));
  });
  $$('.edge',svg).forEach(p=>{
    if(!on){ p.classList.remove('active','dim'); return; }
    const active=p.dataset.from==skillId||p.dataset.to==skillId;
    p.classList.toggle('active',active);
    p.classList.toggle('dim',!active);
  });
}

function openLessonModal(lesson,enrollment,bodyRef){
  const done=db.lessonDone().some(ld=>ld.enrollment_id===enrollment.id&&ld.lesson_id===lesson.id);
  openModal(`
    <div class="modal-head">
      <h2>${esc(lesson.title)}</h2>
      <button class="close" data-close>${ic('close',18)}</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:22px">
        <span>${ic('clock',11)} ${lesson.duration_min||0} мин</span>
        ${done?`<span style="color:var(--green)">${ic('check',11)} пройдено</span>`:''}
      </div>
      <p style="font-size:14.5px;line-height:1.7;color:var(--ink-2)">${esc(lesson.content||'Материал урока скоро появится.')}</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Закрыть</button>
      ${!done?`<button class="btn btn-red" id="btnMarkDone">${ic('check',14)} Отметить пройденным</button>`:''}
    </div>
  `,{
    onMount:()=>{
      $('#btnMarkDone')?.addEventListener('click',()=>{
        const ld=db.lessonDone();
        ld.push({id:uid('ld'),enrollment_id:enrollment.id,lesson_id:lesson.id,completed_at:Date.now()});
        db.saveLessonDone(ld);

        const mods=db.modules().filter(m=>m.course_id===enrollment.course_id);
        const mids=mods.map(m=>m.id);
        const total=db.lessons().filter(l=>mids.includes(l.module_id)).length;
        const doneN=ld.filter(x=>x.enrollment_id===enrollment.id).length;
        const progress=total>0?Math.round(doneN/total*100):0;

        const es=db.enrollments();
        const i=es.findIndex(x=>x.id===enrollment.id);
        es[i].progress=progress;
        if(progress>=100) es[i].completed_at=Date.now();
        db.saveEnrollments(es);

        toast(`Прогресс: ${progress}%`,'ok');
        closeModal();
        renderCourseView(bodyRef,enrollment.course_id);
      });
    },
  });
}

function revenueChartSVG(labels,values){
  const W=720,H=220,pad={t:24,r:20,b:32,l:48};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const maxV=Math.max(...values)*1.15;
  const stepX=iw/Math.max(1,values.length-1);
  const pts=values.map((v,i)=>({x:pad.l+i*stepX,y:pad.t+ih-(v/maxV)*ih,v}));
  const line=pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const area=line+` L ${pts[pts.length-1].x.toFixed(1)} ${pad.t+ih} L ${pad.l} ${pad.t+ih} Z`;

  const yl=[0,Math.round(maxV/2),Math.round(maxV)].map(v=>({v,y:pad.t+ih-(v/maxV)*ih}));

  return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
      <defs>
        <linearGradient id="revG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d13e26" stop-opacity=".14"/>
          <stop offset="1" stop-color="#d13e26" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${yl.map(y=>`
        <line x1="${pad.l}" y1="${y.y.toFixed(1)}" x2="${W-pad.r}" y2="${y.y.toFixed(1)}" stroke="#d9d5c8" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="${pad.l-12}" y="${y.y+4}" text-anchor="end" font-size="10.5" fill="#76736b" font-family="JetBrains Mono, monospace">${y.v}</text>
      `).join('')}
      <path d="${area}" fill="url(#revG)"/>
      <path d="${line}" fill="none" stroke="#d13e26" stroke-width="1.8" stroke-linejoin="round"/>
      ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#d13e26"/>`).join('')}
      ${pts.map((p,i)=>`<text x="${p.x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#76736b" font-family="JetBrains Mono, monospace">${labels[i]}</text>`).join('')}
    </svg>
  `;
}

function openConversation(convId){
  const me=state.user;
  const conv=db.convs().find(c=>c.id===convId);
  if(!conv) return;
  state.currentConv=convId;

  $$('.chat-conv').forEach(el=>el.classList.toggle('active',el.dataset.convId===convId));

  const msgs=db.messages();
  let changed=false;
  msgs.forEach(m=>{
    if(m.conversation_id===convId&&m.sender_id!==me.id&&!m.read_at){ m.read_at=Date.now(); changed=true; }
  });
  if(changed) db.saveMessages(msgs);

  const otherId=conv.user_a===me.id?conv.user_b:conv.user_a;
  const other=db.users().find(u=>u.id===otherId);
  const convMsgs=msgs.filter(m=>m.conversation_id===convId).sort((a,b)=>a.created_at-b.created_at);

  const main=$('#chatMain');
  main.innerHTML=`
    <div class="chat-head">
      ${avatarHTML(other,'md')}
      <div class="who">
        <b>${esc(other?.name||'')}</b>
        <span>${esc(other?.title||roleLabel(other?.role))}</span>
      </div>
      <div style="margin-left:auto">
        <button class="btn-icon sm" id="viewProfileBtn" title="Профиль">${ic('users',14)}</button>
      </div>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input">
      <textarea id="msgInput" placeholder="Написать сообщение…" rows="1"></textarea>
      <button class="btn btn-red" id="sendBtn">${ic('send',16)}</button>
    </div>
  `;

  const msgsEl=$('#chatMsgs');
  if(!convMsgs.length) msgsEl.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px">Сообщений пока нет. Начните первым.</div>`;
  else {
    let lastDay='';
    convMsgs.forEach(m=>{
      const day=fmtDate(m.created_at);
      if(day!==lastDay){ msgsEl.insertAdjacentHTML('beforeend',`<div class="chat-day">${day}</div>`); lastDay=day; }
      msgsEl.insertAdjacentHTML('beforeend',msgHTML(m,me.id));
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  const input=$('#msgInput'), sendBtn=$('#sendBtn');

  function send(){
    const body=input.value.trim(); if(!body) return;
    const allMsgs=db.messages();
    const nm={id:uid('msg'),conversation_id:convId,sender_id:me.id,body,created_at:Date.now(),read_at:null};
    allMsgs.push(nm); db.saveMessages(allMsgs);

    const convs=db.convs(); const i=convs.findIndex(c=>c.id===convId);
    if(i>=0){ convs[i].last_at=Date.now(); db.saveConvs(convs); }

    msgsEl.insertAdjacentHTML('beforeend',msgHTML(nm,me.id));
    msgsEl.scrollTop=msgsEl.scrollHeight;
    input.value=''; input.style.height='auto';

    const cEl=$(`.chat-conv[data-conv-id="${convId}"]`);
    if(cEl){ cEl.querySelector('.body p').textContent=body; cEl.querySelector('.meta .t').textContent=fmtTime(Date.now()); }

    if(other&&!other.email?.startsWith('user_')) setTimeout(()=>simulateReply(convId,other),1200+Math.random()*1600);
  }

  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(120,input.scrollHeight)+'px'; });
  input.focus();

  $('#viewProfileBtn')?.addEventListener('click',()=>{ if(other) openCandidateProfile(other.id); });
}

function msgHTML(m,meId){
  const isMine=m.sender_id===meId;
  return `<div class="chat-msg ${isMine?'mine':'their'}">${esc(m.body)}<div class="meta">${fmtTime(m.created_at)}</div></div>`;
}

function simulateReply(convId,other){
  const replies=[
    'Хорошо, договорились.',
    'Спасибо, посмотрю сегодня.',
    'Могу начать уже завтра.',
    'Обсужу с командой и вернусь.',
    'Ок, спасибо за информацию.',
    'Давайте обсудим детали.',
    'Уточню и напишу.',
  ];
  const me=state.user;
  const msgs=db.messages();
  const nm={id:uid('msg'),conversation_id:convId,sender_id:other.id,body:pick(replies),created_at:Date.now(),read_at:null};
  msgs.push(nm); db.saveMessages(msgs);

  const convs=db.convs(); const i=convs.findIndex(c=>c.id===convId);
  if(i>=0){ convs[i].last_at=Date.now(); db.saveConvs(convs); }

  if(state.currentConv===convId){
    const el=$('#chatMsgs');
    if(el){ el.insertAdjacentHTML('beforeend',msgHTML(nm,me.id)); el.scrollTop=el.scrollHeight; }
    setTimeout(()=>{
      const m2=db.messages();
      m2.forEach(x=>{ if(x.id===nm.id) x.read_at=Date.now(); });
      db.saveMessages(m2);
    },500);
  }

  const cEl=$(`.chat-conv[data-conv-id="${convId}"]`);
  if(cEl){ cEl.querySelector('.body p').textContent=nm.body; cEl.querySelector('.meta .t').textContent=fmtTime(Date.now()); }
}

async function runDeepSeekAnalysis(text,outEl,statusEl){
  outEl.innerHTML=`<div class="a-loader"><div class="a-spin"></div><div class="lbl">Анализируем…</div></div>`;
  if(statusEl) statusEl.textContent='ОБРАБОТКА…';

  const s=db.settings();
  if(s.deepseekKey){
    try{
      const res=await callDeepSeek(text,s.deepseekKey,s.model);
      outEl.dataset.analysis=JSON.stringify(res);
      outEl.innerHTML=`
        <div class="a-source live" style="margin-bottom:16px"><span class="d"></span>DeepSeek · ${esc(s.model)}</div>
        ${renderAnalysisHTML(res)}
      `;
      if(statusEl) statusEl.textContent='ГОТОВО';
      return;
    }catch(e){
      outEl.innerHTML=`<div class="a-error" style="margin-bottom:16px"><b>DeepSeek недоступен</b>${esc(e.message)}. Использую встроенный анализатор.</div>`;
    }
  }

  await new Promise(r=>setTimeout(r,900));
  const mock=mockAnalyze(text);
  outEl.dataset.analysis=JSON.stringify(mock);
  outEl.insertAdjacentHTML('beforeend',`
    <div class="a-source" style="margin-bottom:16px"><span class="d"></span>Встроенный анализатор</div>
    ${renderAnalysisHTML(mock)}
  `);
